; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
; upload_port = /dev/cu.usbmodem101
; monitor_port = /dev/cu.usbmodem101
; These libraries are used by all builds.
lib_deps = 
	https://github.com/ESP32Async/AsyncTCP
	https://github.com/ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^7.1.0
	h2zero/NimBLE-Arduino@^1.4.2

[env:esp32-c3-supermini]
board = esp32-c3-devkitm-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_ESP32C3_DEV=1 -DCORE_DEBUG_LEVEL=0 

[env:esp32-s3-supermini]
board = esp32-s3-devkitc-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_ESP32S3_DEV=1 -DCORE_DEBUG_LEVEL=0 -DCONFIG_ESPTOOLPY_FLASHSIZE_4MB
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
